name: Release

# Separate from CI on purpose. CI answers "does this still build?" on every push and needs
# no secrets; this one holds the signing key, and the fewer runs that touch it the better.
on:
  push:
    tags: ['v*.*.*.*']
  workflow_dispatch:

permissions:
  contents: write          # only the tag run uses it, to draft the release

jobs:
  android:
    name: Signed Android package
    runs-on: ubuntu-latest

    # The signing certificate, as the README publishes it. Both packages are measured
    # against this one value, so a run signed with another key fails here rather than
    # shipping something nobody can verify.
    env:
      EXPECTED_SHA256: ac76ef7e5a6e65d35c32284119de5891715c33f135d8808bbbd55a4a34f63476

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      # A tag is vN.M.O.P. N.M is the version of the proposal document the app implements,
      # kept in the core as SpecificationVersion; O.P is the app's own version. The internal
      # number is N*1000000 + M*10000 + O*100 + P, which only ever grows and can be worked
      # out again from the tag rather than being a counter someone has to remember.
      #
      # O = 0 means preliminary, so those releases are marked prerelease and the first
      # production release of a document is vN.M.1.0. A dispatch run is a rehearsal and
      # builds N.M.0.0: a version that is never published, and that says so by its shape.
      #
      # The rules themselves are in the core, beside the document version they are checked
      # against, and CI runs this same tool on every pull request. They were a shell block
      # here, running only while publishing, which is where two real defects hid.

      # Built here, so that the run below prints the tool's three lines and nothing else:
      # restoring and building write to standard output too, and that output is read.
      - name: Build the version tool
        run: dotnet build tools/ReleaseVersion -c Release

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail

          # Assigned, not piped: a tool whose output goes into a pipe has its exit code
          # thrown away, and a version that could not be worked out has to end the step.
          version=$(dotnet run --project tools/ReleaseVersion -c Release --no-build -- "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME")

          # What is about to become the workflow's outputs, read line by line before it is
          # believed: three lines, and the three keys the rest of this file asks for.
          mapfile -t lines <<< "$version"
          if [ "${#lines[@]}" -ne 3 ] ||
             [[ ${lines[0]} != display=* ]] ||
             [[ ${lines[1]} != code=* ]] ||
             [[ ${lines[2]} != prerelease=* ]]; then
            echo "::error::The version tool printed something other than the three expected lines:"
            printf '%s\n' "$version"
            exit 1
          fi

          printf '%s\n' "$version" >> "$GITHUB_OUTPUT"

          display=${lines[0]#display=}
          code=${lines[1]#code=}
          prerelease=${lines[2]#prerelease=}
          echo "version $display, internal $code, prerelease $prerelease"

      # Outside the workspace, so it cannot be committed, packed into the app or picked up
      # by anything that walks the repository.
      - name: Unpack the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Restore
        run: dotnet restore src/SolsticaKalendaro.App

      # The passwords go in as `env:NAME` rather than as values. That is .NET Android's own
      # syntax for reading a password out of the environment, which keeps it off the command
      # line, out of the process list and out of the build log.
      #
      # One password for both store and key: the keystore is PKCS12, where they are the same.
      # A keystore with a separate key password would need a secret of its own here.
      - name: Publish the signed packages
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish src/SolsticaKalendaro.App
          --no-restore
          --configuration Release
          --framework net10.0-android
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.display }}
          -p:ApplicationVersion=${{ steps.version.outputs.code }}
          -p:AndroidPackageFormats=aab%3Bapk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Name the packages after their version
        id: package
        run: |
          set -euo pipefail

          # The publish folder first, which is where both land, and the rest of the build
          # output as a fallback, so a change in where the SDK puts them is not a silent miss.
          # -print -quit rather than a pipe into head: find stops at the first match itself,
          # so there is no half-read pipe for pipefail to turn into a failed step.
          locate() {
            local hit
            hit=$(find src/SolsticaKalendaro.App/bin/Release/net10.0-android/publish \
                       -name "*-Signed.$1" -print -quit 2>/dev/null)
            [ -n "$hit" ] || hit=$(find src/SolsticaKalendaro.App/bin/Release/net10.0-android \
                                        -name "*-Signed.$1" -print -quit)
            printf '%s' "$hit"
          }

          name() {        # $1 the extension, $2 the output to write the path to
            local built asset
            built=$(locate "$1")
            [ -n "$built" ] || {
              echo "::error::No signed .$1 was produced by the publish."
              exit 1
            }

            asset="$RUNNER_TEMP/solstica-kalendaro-${{ steps.version.outputs.display }}.$1"
            cp "$built" "$asset"
            echo "$2=$asset" >> "$GITHUB_OUTPUT"
            ls -l "$asset"
          }

          name apk path
          name aab bundle

      # Printed so that anyone can check a package they downloaded against the fingerprint
      # in the README, and compared here so that a key swap ends the run rather than shipping
      # quietly. Both packages carry the same certificate and both are checked: one of the two
      # being signed with something else is exactly the accident worth catching.
      - name: Verify the signatures
        run: |
          set -euo pipefail

          # One spelling for every fingerprint: lower case, no colons. apksigner prints it
          # that way already; keytool prints upper case with colons.
          plain() { printf '%s' "$1" | tr -d ':' | tr 'A-Z' 'a-z'; }

          expected=$(plain "$EXPECTED_SHA256")

          agrees() {      # $1 what was checked, $2 the fingerprint as the tool printed it
            local got
            got=$(plain "$2")
            [ -n "$got" ] || { echo "::error::No certificate was found in the $1."; exit 1; }

            if [ "$got" != "$expected" ]; then
              echo "::error::The $1 is signed with another key than the one the README names."
              echo "::error::expected $expected"
              echo "::error::got      $got"
              exit 1
            fi
          }

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "${{ steps.package.outputs.path }}" > apk-certs.txt
          grep -E 'certificate DN:|certificate SHA-256 digest:' apk-certs.txt

          # apksigner does not read a bundle — an AAB is not an APK — but a bundle is a signed
          # jar, which keytool does read.
          keytool -printcert -jarfile "${{ steps.package.outputs.bundle }}" > aab-certs.txt
          grep -E '^Owner:|SHA256:' aab-certs.txt

          agrees "APK" "$(sed -n 's/.*certificate SHA-256 digest: *//p' apk-certs.txt | head -1)"
          agrees "AAB" "$(sed -n 's/.*SHA256: *//p' aab-certs.txt | head -1)"

          echo "Both packages carry the certificate the README names."

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # A rehearsal: it proves the key, the signing and the packaging work, and leaves
      # something installable behind, but it announces nothing.
      - name: Keep the package for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: solstica-kalendaro-apk
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      # The bundle of a rehearsal is a rehearsal too, and its name says so: nothing with
      # "assaig" in it belongs in Play Console.
      - name: Keep the rehearsal bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: solstica-kalendaro-aab-${{ steps.version.outputs.display }}-assaig
          path: ${{ steps.package.outputs.bundle }}
          if-no-files-found: error
          retention-days: 90

      # The bundle is what Google Play takes, and it is kept here rather than attached to the
      # release: an AAB on a release page is something a reader would download and fail to
      # install. It goes to Play Console by hand, from this run.
      - name: Keep the bundle for Google Play
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: solstica-kalendaro-aab-${{ steps.version.outputs.display }}
          path: ${{ steps.package.outputs.bundle }}
          if-no-files-found: error
          retention-days: 90

      # Draft, never published: the tag says a version is ready, a person says it is out.
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Built as a list rather than inline: under `set -e` a substitution that
          # tests false and prints nothing ends the step, so a 1.x tag would have
          # failed right here, at the last moment and for no visible reason.
          flags=(--draft)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi

          # The APK alone: the bundle is an artifact of this run, not a download.
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.path }}" \
            "${flags[@]}" \
            --title "Solstica Kalendaro ${{ steps.version.outputs.display }}" \
            --notes "Instal·lació i verificació de la signatura: vegeu el README."
