name: Release

# Separate from CI on purpose. CI answers "does this still build?" on every push and needs
# no secrets; this one holds the signing key, and the fewer runs that touch it the better.
on:
  push:
    tags: ['v*.*.*.*']
  workflow_dispatch:

permissions:
  contents: write          # only the tag run uses it, to draft the release

jobs:
  android:
    name: Signed Android package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      # A tag is vN.M.O.P. N.M is the version of the proposal document the app implements,
      # kept in the core as SpecificationVersion; O.P is the app's own version. The internal
      # number is N*1000000 + M*10000 + O*100 + P, which only ever grows and can be worked
      # out again from the tag rather than being a counter someone has to remember.
      #
      # O = 0 means preliminary, so those releases are marked prerelease and the first
      # production release of a document is vN.M.1.0. A dispatch run is a rehearsal and
      # builds N.M.0.0: a version that is never published, and that says so by its shape.
      #
      # The rules themselves are in the core, beside the document version they are checked
      # against, and CI runs this same tool on every pull request. They were a shell block
      # here, running only while publishing, which is where two real defects hid.

      # Built here, so that the run below prints the tool's three lines and nothing else:
      # restoring and building write to standard output too, and that output is read.
      - name: Build the version tool
        run: dotnet build tools/ReleaseVersion -c Release

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail

          # Assigned, not piped: a tool whose output goes into a pipe has its exit code
          # thrown away, and a version that could not be worked out has to end the step.
          version=$(dotnet run --project tools/ReleaseVersion -c Release --no-build -- "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME")

          # What is about to become the workflow's outputs, read line by line before it is
          # believed: three lines, and the three keys the rest of this file asks for.
          mapfile -t lines <<< "$version"
          if [ "${#lines[@]}" -ne 3 ] ||
             [[ ${lines[0]} != display=* ]] ||
             [[ ${lines[1]} != code=* ]] ||
             [[ ${lines[2]} != prerelease=* ]]; then
            echo "::error::The version tool printed something other than the three expected lines:"
            printf '%s\n' "$version"
            exit 1
          fi

          printf '%s\n' "$version" >> "$GITHUB_OUTPUT"

          display=${lines[0]#display=}
          code=${lines[1]#code=}
          prerelease=${lines[2]#prerelease=}
          echo "version $display, internal $code, prerelease $prerelease"

      # Outside the workspace, so it cannot be committed, packed into the app or picked up
      # by anything that walks the repository.
      - name: Unpack the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Restore
        run: dotnet restore src/SolsticaKalendaro.App

      # The passwords go in as `env:NAME` rather than as values. That is .NET Android's own
      # syntax for reading a password out of the environment, which keeps it off the command
      # line, out of the process list and out of the build log.
      #
      # One password for both store and key: the keystore is PKCS12, where they are the same.
      # A keystore with a separate key password would need a secret of its own here.
      - name: Publish a signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish src/SolsticaKalendaro.App
          --no-restore
          --configuration Release
          --framework net10.0-android
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.display }}
          -p:ApplicationVersion=${{ steps.version.outputs.code }}
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Name the package after its version
        id: package
        run: |
          set -euo pipefail
          built=$(find src/SolsticaKalendaro.App/bin/Release/net10.0-android/publish -name '*-Signed.apk' | head -1)
          [ -n "$built" ] || { echo "No signed APK was produced."; exit 1; }

          asset="$RUNNER_TEMP/solstica-kalendaro-${{ steps.version.outputs.display }}.apk"
          cp "$built" "$asset"
          echo "path=$asset" >> "$GITHUB_OUTPUT"
          ls -l "$asset"

      # Printed so that anyone can check an APK they downloaded against the fingerprint in
      # the README, and so that a key swap would be visible here rather than silent.
      - name: Verify the signature
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "${{ steps.package.outputs.path }}" > certs.txt
          grep -E 'certificate DN:|certificate SHA-256 digest:' certs.txt

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # A rehearsal: it proves the key, the signing and the packaging work, and leaves
      # something installable behind, but it announces nothing.
      - name: Keep the package for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: solstica-kalendaro-apk
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      # Draft, never published: the tag says a version is ready, a person says it is out.
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Built as a list rather than inline: under `set -e` a substitution that
          # tests false and prints nothing ends the step, so a 1.x tag would have
          # failed right here, at the last moment and for no visible reason.
          flags=(--draft)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.path }}" \
            "${flags[@]}" \
            --title "Solstica Kalendaro ${{ steps.version.outputs.display }}" \
            --notes "Instal·lació i verificació de la signatura: vegeu el README."
