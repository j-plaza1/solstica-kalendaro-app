name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core library and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  # The Android job is deliberately left until the app project exists. It will need
  # `dotnet workload install maui-android`, a JDK, and the signing key read from
  # secrets — never from the repository. Roughly:
  #
  # android:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-java@v4
  #       with: { distribution: temurin, java-version: '17' }
  #     - uses: actions/setup-dotnet@v4
  #       with: { dotnet-version: '10.0.x' }
  #     - run: dotnet workload install maui-android
  #     - run: dotnet publish src/SolsticaKalendaro.App -f net10.0-android -c Release
