name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core library and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Scoped to the test project, which pulls in the core library. Building the
      # whole solution would drag in SolsticaKalendaro.App, and this runner has no
      # MAUI workloads: the Android build belongs in the job below.
      - name: Restore
        run: dotnet restore tests/SolsticaKalendaro.Core.Tests

      - name: Build
        run: dotnet build tests/SolsticaKalendaro.Core.Tests --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/SolsticaKalendaro.Core.Tests --no-build --configuration Release --verbosity normal

  # The app project now exists, but the Android job stays off until someone wants CI
  # artefacts from it. It will need
  # `dotnet workload install maui-android`, a JDK, and the signing key read from
  # secrets — never from the repository. Roughly:
  #
  # android:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-java@v4
  #       with: { distribution: temurin, java-version: '17' }
  #     - uses: actions/setup-dotnet@v4
  #       with: { dotnet-version: '10.0.x' }
  #     - run: dotnet workload install maui-android
  #     - run: dotnet publish src/SolsticaKalendaro.App -f net10.0-android -c Release
