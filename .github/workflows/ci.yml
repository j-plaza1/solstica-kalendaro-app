name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core library and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Scoped to the test project, which pulls in the core library. Building the
      # whole solution would drag in SolsticaKalendaro.App, and this runner has no
      # MAUI workloads: the Android build belongs in the job below.
      - name: Restore
        run: dotnet restore tests/SolsticaKalendaro.Core.Tests

      - name: Build
        run: dotnet build tests/SolsticaKalendaro.Core.Tests --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/SolsticaKalendaro.Core.Tests --no-build --configuration Release --verbosity normal

      # The version a release would be given, worked out here on every pull request rather
      # than for the first time while publishing. A production tag is among them: that path
      # has never been taken by a release, and it is taken here before it is taken there.
      - name: Release versions
        run: |
          set -euo pipefail
          tool="dotnet run --project tools/ReleaseVersion -c Release --"

          says() {
            got=$($tool "$1" "$2") || { echo "::error::$1 $2 was refused"; exit 1; }
            printf '%s\n' "$got" | grep -qx "$3" || {
              echo "::error::$1 $2: expected $3, and got:"
              printf '%s\n' "$got"
              exit 1
            }
          }

          refuses() {
            if $tool "$1" "$2" > /dev/null 2>&1; then
              echo "::error::$1 $2 was accepted, and should not have been"
              exit 1
            fi
          }

          says tag v2.1.1.0 'display=2.1.1.0'
          says tag v2.1.1.0 'code=2010100'
          says tag v2.1.1.0 'prerelease=false'
          says tag v2.1.0.1 'prerelease=true'
          says branch main 'display=2.1.0.0'

          refuses tag v2.1.100.0
          refuses tag v9.9.1.0

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore src/SolsticaKalendaro.App

      # Build rather than publish: this job answers "does the app still compile, and do
      # its resources and fonts still pack?", which is the question a pull request asks.
      # Producing something installable is the release's job, not this one.
      #
      # Unsigned on purpose. The release key lives in a secret and never in the
      # repository, and nothing here needs it: AndroidKeyStore=false keeps the build from
      # reaching for one.
      - name: Build
        run: >
          dotnet build src/SolsticaKalendaro.App
          -f net10.0-android
          --no-restore
          --configuration Release
          -p:AndroidKeyStore=false
